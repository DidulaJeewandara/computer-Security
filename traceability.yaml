# [JDH] R1-R10 and T1-T8 mapped to the task IDs and test names that discharge them
#
# Definitions of every R and T are in RT.md. Task IDs are the ones in prompt.md.
#
# One row per task:
#   task:        task ID from prompt.md
#   status:      done  - merged; every listed test file must exist
#                open  - not built yet; tests are the planned test files
#   discharges:  the requirements and threats this task's tests give evidence for
#   role:        supporting-infrastructure - needed by everything, but not evidence
#                for any R or T on its own, so it never counts as coverage
#   tests:       test files (repo-relative); a comment may name the test inside
#
# `pnpm trace:check` fails when any R or T has no linked test, when a row has no
# task ID or no test, or when a done row names a test file that does not exist.
#
# Rows marked open are JDH's first mapping from prompt.md. Each owner corrects
# their own rows when the task lands and flips status to done in the same PR.

# P0-RMR-1 — canonical sigma_s encoding and message schemas
- task: P0-RMR-1
  status: done
  discharges: [T3, T4] # handshake tampering and Lowe-style substitution: signer and verifier parse the signed bytes identically
  tests:
    - packages/protocol/src/encode.test.ts # round trip; no two field triples encode to the same bytes
    - packages/protocol/src/types.test.ts # round trip of all six messages; unknown fields rejected

# P0-RMR-2 — development certificate authority
- task: P0-RMR-2
  status: done
  discharges: [T3, T4] # the client validates the chain, so a rogue cert can't sit in the middle of the TLS layer
  tests:
    - apps/auth-server/src/tls.test.ts # untrusted CA, self-signed, wrong host and expired certs rejected; no verification bypass in the repo

- task: P0-UDK-1
  status: done
  discharges: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10]
  role: supporting-infrastructure
  tests:
    - tests/platform/scaffold.test.mjs

# P1-RMR-1 — Argon2id password hashing service
- task: P1-RMR-1
  status: done
  discharges: [R1, T1] # R1: no credential stored in clear; a leaked store holds only Argon2id hashes
  tests:
    - apps/auth-server/src/auth/password.test.ts # weaker hash upgraded at next login and stored parameters change; tampering fails; constant-time compare

# P1-RMR-2 — password and passphrase policy (NIST SP 800-63B)
- task: P1-RMR-2
  status: done
  discharges: [T8] # no composition rules, passphrases and paste allowed: secure without pushing users to unsafe workarounds
  tests:
    - apps/auth-server/src/auth/passwordPolicy.test.ts # breached password rejected with a plain explanation; 40-char passphrase with spaces accepted; only a 5-char hash prefix is looked up
    - apps/auth-server/src/auth/password.test.ts # NFC and NFD forms of one password verify against the same hash

# P0-JDH-1 — this matrix and its check
- task: P0-JDH-1
  status: done
  discharges: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, T1, T2, T3, T4, T5, T6, T7, T8]
  role: supporting-infrastructure
  tests:
    - tests/platform/traceability.test.ts # unlinking one requirement fails the check and names it

# P0-JDH-2 — CI pipeline
- task: P0-JDH-2
  status: done
  discharges: [R1]
  role: supporting-infrastructure # gitleaks keeps secrets out of the repo; not evidence for R1 on its own
  tests:
    - tests/platform/traceability.test.ts # the pipeline runs this and every other suite

